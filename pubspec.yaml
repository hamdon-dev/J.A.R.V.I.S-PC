name: jarvis_assistant
description: J.A.R.V.I.S. — Iron Man style personal AI assistant (Windows)
publish_to: "none"
version: 2.2.0+30

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  local_auth: ^2.3.0
  mysql1: ^0.20.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
